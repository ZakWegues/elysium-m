plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.confianca'
version = '1.0.0'

android {
  namespace "expo.modules.confianca"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // A mesma versão do OkHttp do React Native (e do expo-file-system).
  implementation 'com.squareup.okhttp3:okhttp:4.9.2'
  implementation 'com.facebook.react:react-android'
}
