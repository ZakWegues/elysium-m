plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.vidro'
version = '1.0.0'

android {
  namespace "expo.modules.vidro"
  defaultConfig {
    versionCode 1
    versionName "1.0.0"
  }
}

dependencies {
  // O BlurTarget do expo-blur (Dimezis): é dele que vem o conteúdo das telas, já gravado num RenderNode.
  compileOnly 'com.github.Dimezis:BlurView:version-3.1.0'
  implementation 'com.facebook.react:react-android'
}
