# Fase 13, bloco 114: tsc + vitest + o bundle do Expo a cada push. O bundle é o que pega
# import quebrado em tempo de execução, que o typecheck sozinho deixa passar (§17).
# O `npm run release` recusa publicar um commit cujo check não passou.
name: check

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run check
